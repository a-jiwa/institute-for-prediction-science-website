<!doctype html>
<html lang="en" class="fonts-pending">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102B23" />
    <meta name="description" content="We’re building a better understanding of forecasting and finding practical ways to apply it to real-world problems." />
    <title>The Institute for Predictive Sciences</title>

    <!-- Fetch brand fonts before CSS/JS so first paint can use them. crossorigin is required for font preloads. -->
    <link rel="preload" href="/assets/fonts/GoogleSansFlex.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/MartinaPlantijn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/MartinaPlantijn-Italic.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Register critical faces in the head so document.fonts.load() can wait on them before React boots. -->
    <style>
      @font-face {
        font-family: 'Sans';
        src: url('/assets/fonts/GoogleSansFlex.woff2') format('woff2');
        font-weight: 1 1000;
        font-style: oblique 0deg 10deg;
        font-display: block;
      }
      @font-face {
        font-family: 'Google Sans Flex';
        src: url('/assets/fonts/GoogleSansFlex.woff2') format('woff2');
        font-weight: 1 1000;
        font-style: oblique 0deg 10deg;
        font-display: block;
      }
      @font-face {
        font-family: 'Serif';
        src: url('/assets/fonts/MartinaPlantijn-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Serif';
        src: url('/assets/fonts/MartinaPlantijn-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      /* Match page canvas while we wait so the brief hold is a white screen, not a flash. */
      html {
        background: #fff;
      }
      html.fonts-pending body {
        opacity: 0;
      }
      html.fonts-ready body,
      html.fonts-fallback body {
        opacity: 1;
        transition: opacity 0.2s ease;
      }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement
        var done = false
        function finish(ok) {
          if (done) return
          done = true
          root.classList.remove('fonts-pending')
          root.classList.add(ok ? 'fonts-ready' : 'fonts-fallback')
        }
        var timeout = window.setTimeout(function () {
          finish(false)
        }, 1500)
        if (!document.fonts || !document.fonts.load) {
          window.clearTimeout(timeout)
          finish(false)
          return
        }
        Promise.all([
          document.fonts.load('600 16px Sans'),
          document.fonts.load('700 75px "Google Sans Flex"'),
          document.fonts.load('400 16px Serif'),
          document.fonts.load('italic 400 16px Serif'),
        ])
          .then(function () {
            window.clearTimeout(timeout)
            finish(true)
          })
          .catch(function () {
            window.clearTimeout(timeout)
            finish(false)
          })
      })()
    </script>
    <script type="text/javascript">
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
