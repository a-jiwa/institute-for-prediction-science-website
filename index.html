<!doctype html>
<html lang="en" class="theme-ips fonts-pending">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-96x96-dark.png" sizes="96x96" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-32x32-dark.png" sizes="32x32" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-16x16-dark.png" sizes="16x16" media="(prefers-color-scheme: dark)" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-dark.png" sizes="180x180" media="(prefers-color-scheme: dark)" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#102B23" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#102B23" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Institute for Prediction Science" />
    <meta name="apple-mobile-web-app-title" content="Prediction Science" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The Institute for Prediction Science is an independent research institute with a mission to improve how people and organisations forecast uncertain events and make better decisions." />
    <title>Institute for Prediction Science</title>
    <link rel="canonical" href="https://www.predictionscience.org/" />

    <!-- Filled from src/data/socialShare.ts so crawlers and the app share one card. -->
    <!--og-share-->

    <!-- Fetch brand fonts before CSS/JS so first paint can use them. crossorigin is required for font preloads. -->
    <link rel="preload" href="/assets/fonts/GoogleSansFlex.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/AnthropicSerifVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/MartinaPlantijn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/MartinaPlantijn-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <!-- Register critical faces in the head so document.fonts.load() can wait on them before React boots. -->
    <style>
      @font-face {
        font-family: 'Sans';
        src: url('/assets/fonts/GoogleSansFlex.woff2') format('woff2');
        font-weight: 1 1000;
        font-style: oblique 0deg 10deg;
        font-display: block;
      }
      @font-face {
        font-family: 'Google Sans Flex';
        src: url('/assets/fonts/GoogleSansFlex.woff2') format('woff2');
        font-weight: 1 1000;
        font-style: oblique 0deg 10deg;
        font-display: block;
      }
      @font-face {
        font-family: 'Anthropic Serif';
        src: url('/assets/fonts/AnthropicSerifVariable.woff2') format('woff2');
        font-weight: 300 800;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Serif';
        src: url('/assets/fonts/MartinaPlantijn-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Serif';
        src: url('/assets/fonts/MartinaPlantijn-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }
      /* Match the page canvas while fonts load so the hold is a white screen. */
      html.fonts-pending {
        background: #fff;
      }
      html.fonts-pending body {
        opacity: 0;
      }
      html.fonts-ready body,
      html.fonts-fallback body {
        opacity: 1;
        transition: opacity 0.2s ease;
      }
    </style>
    <script>
      ;(function () {
        var root = document.documentElement
        var done = false
        function finish(ok) {
          if (done) return
          done = true
          root.classList.remove('fonts-pending')
          root.classList.add(ok ? 'fonts-ready' : 'fonts-fallback')
        }
        var timeout = window.setTimeout(function () {
          finish(false)
        }, 1500)
        if (!document.fonts || !document.fonts.load) {
          window.clearTimeout(timeout)
          finish(false)
          return
        }
        Promise.all([
          document.fonts.load('600 16px Sans'),
          document.fonts.load('700 75px "Google Sans Flex"'),
          document.fonts.load('350 48px "Anthropic Serif"'),
          document.fonts.load('400 16px Serif'),
          document.fonts.load('italic 400 16px Serif'),
        ])
          .then(function () {
            window.clearTimeout(timeout)
            finish(true)
          })
          .catch(function () {
            window.clearTimeout(timeout)
            finish(false)
          })
      })()
    </script>
    <script type="text/javascript">
      ;(function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search
            .slice(1)
            .split('&')
            .map(function (segment) {
              return segment.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
