<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="n" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="1.55" intercept="-0.28"/>
      <feFuncG type="linear" slope="1.55" intercept="-0.28"/>
      <feFuncB type="linear" slope="1.55" intercept="-0.28"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#n)"/>
</svg>
